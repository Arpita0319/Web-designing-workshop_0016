<!DOCTYPE html>
<html>
    <head>
        <title>Creating a Table</title>
    </head>
    <body bgcolor="pink">
        <table border="2" width="50%" height="80%" bgcolor="lightblue" align="center">
            <thead align="center">Details
            <tr>
                <th>Sr. No.</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Age</th>
            </tr></thead>
            <tr>
                <td rowspan="2">1</td>
                <td>Shivam</td>
                <td>Male</td>
                <td>28</td>
            </tr>
            <tr>
                <td>Savan</td>
                <td>Male</td>
                <td>29</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Deepanshu</td>
                <td>Male</td>
                <td>26</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Gauri</td>
                <td>Female</td>
                <td>22</td>
            </tr>
        </table>
    </body>
